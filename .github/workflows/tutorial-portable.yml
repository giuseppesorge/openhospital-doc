# Records the tutorial on downloading, installing and starting the Linux portable package of a release
# (trial for OP-1582): XFCE desktop under Xvfb, a clean user "user", real mouse and keyboard.

name: Video tutorial, Linux portable

on:
  push:
    branches:
      - 'OP-1582-**'
    paths:
      - 'tutorials/portable/**'
      - '.github/workflows/tutorial-portable.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release, for example 1.15.2'
        default: '1.15.2'

jobs:
  record:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install a desktop, OCR and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg xvfb x11-xserver-utils dbus-x11 xdotool wmctrl \
            xfce4 xfconf xfwm4 xfce4-panel xfce4-terminal thunar thunar-archive-plugin xarchiver xfdesktop4 tesseract-ocr fonts-dejavu libaio1t64
          # the MariaDB of the portable package looks for the old name of libaio
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libaio.so.1t64 /usr/lib/x86_64-linux-gnu/libaio.so.1
          # the runner has MySQL installed: its /etc/mysql/my.cnf (user=mysql) is read by mysql_install_db too
          sudo mv /etc/mysql /etc/mysql.runner
          sudo pip3 install --break-system-packages -q playwright

      - name: Clean user with an XFCE session
        run: |
          sudo useradd -m -s /bin/bash user
          # a neutral computer name for the terminal title
          sudo hostname pc && echo '127.0.1.1 pc' | sudo tee -a /etc/hosts > /dev/null
          echo "PS1='user:\w\$ '" | sudo tee -a /home/user/.bashrc > /dev/null
          uid=$(id -u user)
          sudo install -d -o user -m 700 /run/user/$uid
          # runs a command as user with a clean environment (the one of the runner points to /home/runner)
          printf '#!/bin/sh\nexec sudo -u user env -i HOME=/home/user USER=user LOGNAME=user SHELL=/bin/bash LANG=C.UTF-8 PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin DISPLAY=:99 XDG_RUNTIME_DIR=/run/user/%s "$@"\n' $uid \
            | sudo tee /usr/local/bin/asuser > /dev/null
          sudo chmod +x /usr/local/bin/asuser
          # the Web Browser launcher of the panel opens Google Chrome with a debugging port, so the script can follow
          # the pages while the downloads stay the normal ones of Chrome
          asuser mkdir -p /home/user/.local/share/xfce4/helpers /home/user/.config/xfce4
          printf '[Desktop Entry]\nType=X-XFCE-Helper\nX-XFCE-Category=WebBrowser\nName=Google Chrome\nIcon=google-chrome\nX-XFCE-Binaries=google-chrome;\nX-XFCE-Commands=google-chrome --remote-debugging-port=9222 --user-data-dir=/home/user/.config/chrome-tutorial --no-first-run --no-default-browser-check --start-maximized;\nX-XFCE-CommandsWithParameter=google-chrome --remote-debugging-port=9222 --user-data-dir=/home/user/.config/chrome-tutorial --no-first-run --no-default-browser-check --start-maximized "%%s";\n' \
            | asuser tee /home/user/.local/share/xfce4/helpers/custom-WebBrowser.desktop > /dev/null
          echo 'WebBrowser=custom-WebBrowser' | asuser tee /home/user/.config/xfce4/helpers.rc > /dev/null
          # default panel, without the question at the first start
          asuser mkdir -p /home/user/.config/xfce4/xfconf/xfce-perchannel-xml
          asuser cp /etc/xdg/xfce4/panel/default.xml /home/user/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-panel.xml
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 2
          DISPLAY=:99 xhost +SI:localuser:user
          asuser dbus-launch --exit-with-session startxfce4 > /tmp/xfce.log 2>&1 &
          sleep 12

      - name: Record
        env:
          VERSION: ${{ inputs.version || '1.15.2' }}
        run: |
          # the home of the runner is closed to other users: script and output go through /srv/tut
          sudo mkdir -p /srv/tut && sudo cp tutorials/portable/desk.py /srv/tut/ && sudo chown -R user /srv/tut
          asuser python3 /srv/tut/desk.py linux-portable "$VERSION" /srv/tut/out || status=$?
          mkdir -p out && cp -r /srv/tut/out out/linux-portable
          exit ${status:-0}

      - name: Add the music
        run: |
          mkdir -p videos
          sh tutorials/music/add_music.sh out/linux-portable/linux-portable.mp4 videos/linux-portable.mp4 happy
          cp out/linux-portable/linux-portable.en.vtt videos/

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-linux-portable
          path: |
            videos
            out/linux-portable/*.png
            /tmp/xfce.log
