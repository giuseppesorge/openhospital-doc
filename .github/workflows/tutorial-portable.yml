# Records the tutorial on installing and starting the Linux portable package of a release (trial for OP-1582).

name: Video tutorial, Linux portable

on:
  push:
    branches:
      - 'OP-1582-**'
    paths:
      - 'tutorials/portable/**'
      - '.github/workflows/tutorial-portable.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release, for example 1.15.2'
        default: '1.15.2'

jobs:
  record:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Xvfb, window manager, terminal and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg xvfb fluxbox xterm xdotool wmctrl bc fonts-dejavu

      - name: Record
        env:
          VERSION: ${{ inputs.version || '1.15.2' }}
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1600x1000x24 &
          sleep 2
          mkdir -p ~/.fluxbox && echo 'exec fluxbox' > ~/.fluxbox/startup
          fluxbox > /dev/null 2>&1 &
          sleep 3
          pkill -x xmessage || true
          tutorials/portable/linux-portable.sh "$VERSION" out/linux-portable

      - name: Add the music
        run: |
          mkdir -p videos
          sh tutorials/music/add_music.sh out/linux-portable/linux-portable.mp4 videos/linux-portable.mp4 happy
          cp out/linux-portable/linux-portable.en.vtt videos/

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-linux-portable
          path: |
            videos
            out/linux-portable/*.png
            out/linux-portable/windows.txt
