# Records the tutorial on downloading, installing and starting the Windows portable package of a release
# (trial for OP-1582) on the desktop of a Windows runner; captions and music are added on Linux.

name: Video tutorial, Windows portable

on:
  push:
    branches:
      - 'OP-1582-**'
    paths:
      - 'tutorials/portable/desk_win.py'
      - 'tutorials/portable/cut.py'
      - '.github/workflows/tutorial-portable-windows.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release, for example 1.15.2'
        default: '1.15.2'

jobs:
  record:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Prepare the desktop
        shell: powershell
        run: |
          choco install ffmpeg tesseract -y --no-progress | Out-Null
          pip install -q pywinauto playwright
          # file names with their extension, so oh.bat is told apart from oh.ps1 and the oh folder
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' HideFileExt 0
          # a desktop with Edge only: the other icons are tools of the runner
          Get-ChildItem "$env:PUBLIC\Desktop", "$env:USERPROFILE\Desktop" -Filter '*.lnk' -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notlike '*Edge*' } | Remove-Item -Force
          # the Edge shortcuts open Edge with a debugging port and an own profile (needed for the port)
          $sh = New-Object -ComObject WScript.Shell
          $links = Get-ChildItem -Recurse -Filter '*Edge*.lnk' -ErrorAction SilentlyContinue `
            "$env:APPDATA\Microsoft\Internet Explorer\Quick Launch", "$env:PUBLIC\Desktop", "$env:USERPROFILE\Desktop"
          foreach ($l in $links) {
            $k = $sh.CreateShortcut($l.FullName)
            $k.Arguments = "--remote-debugging-port=9222 --user-data-dir=$env:LOCALAPPDATA\EdgeTutorial --no-first-run about:blank"
            $k.Save()
            Write-Host "shortcut: $($l.FullName)"
          }
          # Edge without first-run pages, news or questions on downloads
          $edge = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge'
          New-Item -Path $edge -Force | Out-Null
          Set-ItemProperty $edge HideFirstRunExperience 1 -Type DWord
          Set-ItemProperty $edge PromptForDownloadLocation 0 -Type DWord
          Set-ItemProperty $edge DefaultBrowserSettingEnabled 0 -Type DWord
          Set-ItemProperty $edge NewTabPageContentEnabled 0 -Type DWord
          Set-ItemProperty $edge RestoreOnStartup 4 -Type DWord
          New-Item -Path "$edge\RestoreOnStartupURLs" -Force | Out-Null
          Set-ItemProperty "$edge\RestoreOnStartupURLs" 1 'about:blank'
          # the firewall stays on: if it asks about MariaDB or Java, the video shows it (OH-README)
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled True
          Get-Process ServerManager -ErrorAction SilentlyContinue | Stop-Process -Force
          try { Set-DisplayResolution -Width 1280 -Height 800 -Force } catch { Write-Host "resolution unchanged: $_" }

      - name: Record
        env:
          VERSION: ${{ inputs.version || '1.15.2' }}
        run: |
          $env:Path = "C:\ProgramData\chocolatey\bin;$env:Path"
          python tutorials/portable/desk_win.py $env:VERSION out/windows-portable

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-raw
          path: out/windows-portable

  finish:
    needs: record
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: windows-raw
          path: raw

      - name: Shorter waits, captions and music
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu bc
          mkdir -p videos
          python3 -I tutorials/portable/cut.py raw/raw.mp4 raw/windows-portable.en.vtt raw/waits.txt raw/captioned.mp4 videos/windows-portable.en.vtt raw/pointer.txt
          sh tutorials/music/add_music.sh raw/captioned.mp4 videos/windows-portable.mp4 happy

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-windows-portable
          path: videos
